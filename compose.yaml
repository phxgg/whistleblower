services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    volumes:
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
